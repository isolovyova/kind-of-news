# Non-secret settings for the Kind of News runner.
# Copy this file to config.yml and edit delivery.channels during one-time setup.
language: en
timezone: America/Vancouver
model: gpt-5.6-terra

schedule:
  days:
    - monday
    - wednesday
    - friday
  time: "06:00"

delivery:
  # Choose one or more: gmail, telegram, webhook.
  channels:
    - gmail
  # Used only when webhook is selected.
  webhook_provider: generic

# Optional repository variable for Gmail delivery, not a secret:
# GMAIL_FROM=newsishletter@gmail.com
# It must already be verified as a Gmail Send As alias for the OAuth account.
