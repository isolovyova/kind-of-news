# Non-secret settings for the automated Kind of News runner.
language: en
timezone: America/Vancouver
model: gpt-5.6-terra

schedule:
  days:
    - monday
    - wednesday
    - friday
  time: "06:00"

delivery:
  channels:
    # Emails the issue to Buttondown subscribers.
    - buttondown
    # Writes the issue into docs/issues/ for the public GitHub Pages site.
    - site

# BUTTONDOWN_API_KEY is supplied by secure host or GitHub Actions secret
# storage. Never write it to this file or paste it into chat. The site
# channel needs no credential of its own.
