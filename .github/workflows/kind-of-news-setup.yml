name: Kind of News Setup

on:
  workflow_dispatch:
    inputs:
      channels:
        description: "Comma-separated channels: buttondown, gmail, telegram, webhook"
        required: true
        type: string
        default: gmail
      timezone:
        description: "IANA timezone for the delivery schedule"
        required: true
        type: string
        default: America/Vancouver
      issue_time:
        description: "Local delivery time, HH:MM"
        required: true
        type: string
        default: "06:00"
      webhook_provider:
        description: "Payload preset used only when webhook is selected"
        required: true
        type: choice
        options:
          - generic
          - slack
          - discord
          - ntfy
        default: generic

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Write non-secret configuration
        env:
          KIND_OF_NEWS_CHANNELS: ${{ inputs.channels }}
          KIND_OF_NEWS_TIMEZONE: ${{ inputs.timezone }}
          KIND_OF_NEWS_TIME: ${{ inputs.issue_time }}
          KIND_OF_NEWS_WEBHOOK_PROVIDER: ${{ inputs.webhook_provider }}
        run: |
          python scripts/setup.py \
            --channels "$KIND_OF_NEWS_CHANNELS" \
            --timezone "$KIND_OF_NEWS_TIMEZONE" \
            --time "$KIND_OF_NEWS_TIME" \
            --webhook-provider "$KIND_OF_NEWS_WEBHOOK_PROVIDER" \
            --output config.yml

      - name: Save configuration to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yml
          if git diff --cached --quiet; then
            echo "Configuration is unchanged."
          else
            git commit -m "chore: configure Kind of News delivery"
            git push
          fi

      - name: Validate skill and credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python scripts/validate_skill.py skills/kind-of-news
          python scripts/setup.py --check --config config.yml
