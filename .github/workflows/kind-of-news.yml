name: Kind of News

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kind-of-news.yml
  schedule:
    # The site gets a fresh issue every day. Email remains limited to M/W/F.
    # GitHub may delay scheduled runs during high-load periods.
    - cron: "0 6 * * *"
      timezone: "America/Vancouver"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose dry-run, site-only, or send (site plus Buttondown)."
        required: true
        type: choice
        options:
          - dry-run
          - site-only
          - send
        default: dry-run
      issue_date:
        description: "Optional YYYY-MM-DD override for a manual run."
        required: false
        type: string

permissions:
  # Write access is needed so the site channel can commit the published issue
  # into docs/issues/ for GitHub Pages.
  contents: write
  actions: write

concurrency:
  group: kind-of-news-${{ github.ref }}-${{ inputs.issue_date || 'scheduled' }}
  cancel-in-progress: false

jobs:
  generate-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve issue date
        id: issue
        env:
          REQUESTED_DATE: ${{ inputs.issue_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          requested = os.environ.get("REQUESTED_DATE", "").strip()
          issue_date = requested or datetime.now(ZoneInfo("America/Vancouver")).date().isoformat()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("date=%s\n" % issue_date)
          PY

      - name: Resolve run mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          ISSUE_DATE: ${{ steps.issue.outputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import date

          requested = os.environ.get("REQUESTED_MODE", "").strip()
          event_name = os.environ.get("EVENT_NAME", "").strip()
          if requested:
              mode = requested
          elif event_name == "push":
              # Workflow changes may refresh the site, but must never email.
              mode = "site-only"
          else:
              # The public site is daily; Buttondown stays on Monday,
              # Wednesday, and Friday.
              mode = "send" if date.fromisoformat(os.environ["ISSUE_DATE"]).weekday() in {0, 2, 4} else "site-only"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("mode=%s\n" % mode)
          PY

      - name: Restore issue state
        uses: actions/cache/restore@v4
        with:
          path: .kind-of-news-state
          key: kind-of-news-state-${{ steps.issue.outputs.date }}

      - name: Validate config and required secrets
        if: ${{ steps.mode.outputs.mode == 'send' || steps.mode.outputs.mode == 'site-only' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python - <<'PY'
          from runner.config import load_config, missing_secret_names

          missing = missing_secret_names(load_config("config.yml"))
          if __import__("os").environ["RUN_MODE"] == "site-only":
              missing = [name for name in missing if name != "BUTTONDOWN_API_KEY"]
          if missing:
              raise SystemExit("Missing required secrets: " + ", ".join(missing))
          PY

      - name: Generate and deliver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$RUN_MODE" = "dry-run" ]; then
            python -m runner --config config.yml --date "${{ steps.issue.outputs.date }}" --dry-run
          elif [ "$RUN_MODE" = "site-only" ]; then
            python -m runner --config config.yml --date "${{ steps.issue.outputs.date }}" --site-only
          else
            python -m runner --config config.yml --date "${{ steps.issue.outputs.date }}"
          fi

      - name: Publish issue to the site
        if: ${{ steps.mode.outputs.mode == 'send' || steps.mode.outputs.mode == 'site-only' }}
        env:
          ISSUE_DATE: ${{ steps.issue.outputs.date }}
        run: |
          if [ -z "$(git status --porcelain docs/issues)" ]; then
            echo "No site changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/issues
          git commit -m "Publish Kind of News #${ISSUE_DATE}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Save issue state
        if: ${{ always() && (steps.mode.outputs.mode == 'send' || steps.mode.outputs.mode == 'site-only') }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .kind-of-news-state
          key: kind-of-news-state-${{ steps.issue.outputs.date }}
