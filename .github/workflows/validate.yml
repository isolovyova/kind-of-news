name: Validate Kind of News

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate skill
        run: python scripts/validate_skill.py skills/kind-of-news

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
